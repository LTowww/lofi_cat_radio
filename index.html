<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Cat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            position: absolute;
            height: 50px;
            width: 100%;
            border-bottom: 1px solid gray;
            border-radius: 10px;
            background: transparent;
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header_links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header_links a {
            color: #fff;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            transition: color 0.15s ease;
        }

        .header_links a:hover {
            color: #2de2ff;
        }

        .title_header {
            z-index: 30;
            color: rgba(255, 47, 208, 0.8);
            font-size: 45px;
            font-family: 'Orbitron';
        }

        .text {
            color: #fff;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 130px;
            filter: url(#wave-filter);
        }

        .text_div {
            position: absolute;
            height: 650px;
            width: 1300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .gif_cat {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .lofi-player {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: linear-gradient(135deg, rgba(30, 10, 50, 0.85), rgba(10, 10, 30, 0.85));
            border: 1px solid #ff2fd0;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(255, 47, 208, 0.6), 0 0 24px rgba(45, 226, 255, 0.3);
            backdrop-filter: blur(4px);
            font-family: 'Orbitron', sans-serif;
        }

        .lofi-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff2fd0, #2de2ff);
            box-shadow: 0 0 10px rgba(255, 47, 208, 0.8);
            transition: transform 0.15s ease;
        }

        .lofi-toggle:hover {
            transform: scale(1.08);
        }

        .lofi-toggle svg {
            width: 16px;
            height: 16px;
            fill: #0a0a1a;
        }

        .lofi-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lofi-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #2de2ff;
            text-shadow: 0 0 6px rgba(45, 226, 255, 0.8);
        }

        .lofi-bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 14px;
        }

        .lofi-bars span {
            width: 3px;
            height: 4px;
            background: linear-gradient(180deg, #ff2fd0, #2de2ff);
            border-radius: 2px;
        }

        .lofi-player.playing .lofi-bars span {
            animation: lofi-bounce 0.8s ease-in-out infinite;
        }

        .lofi-player.playing .lofi-bars span:nth-child(1) {
            animation-delay: 0s;
        }

        .lofi-player.playing .lofi-bars span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .lofi-player.playing .lofi-bars span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .lofi-player.playing .lofi-bars span:nth-child(4) {
            animation-delay: 0.1s;
        }

        @keyframes lofi-bounce {

            0%,
            100% {
                height: 4px;
            }

            50% {
                height: 14px;
            }
        }

        .coffee-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: linear-gradient(135deg, rgba(30, 10, 50, 0.85), rgba(10, 10, 30, 0.85));
            border: 1px solid #2de2ff;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(45, 226, 255, 0.6), 0 0 24px rgba(255, 47, 208, 0.3);
            backdrop-filter: blur(4px);
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            color: #fff;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .coffee-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 18px rgba(45, 226, 255, 0.9), 0 0 32px rgba(255, 47, 208, 0.5);
        }

        .coffee-icon {
            width: 22px;
            height: 22px;
            color: #ffb703;
            flex-shrink: 0;
        }    

        .coffee-label {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #2de2ff;
            text-shadow: 0 0 6px rgba(45, 226, 255, 0.8);
            white-space: nowrap;
        }
    </style>
</head>

<body>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4098536442439141"
     crossorigin="anonymous"></script>
    <svg width="0" height="0" style="position: absolute;">
        <filter id="wave-filter">
            <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="2" result="turb"
                seed="3" />
            <feDisplacementMap in="SourceGraphic" in2="turb" scale="25" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>
    <div class="lofi-player">
        <audio id="lofi-audio" loop preload="none">
            <source src="https://ice5.somafm.com/groovesalad-128-mp3" type="audio/mpeg">
            <source src="https://ice3.somafm.com/groovesalad-128-mp3" type="audio/mpeg">
        </audio>

        <button id="lofi-toggle" class="lofi-toggle" aria-label="Play/Pause">
            <svg class="icon-play" viewBox="0 0 24 24">
                <polygon points="5,3 19,12 5,21" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" style="display:none">
                <rect x="5" y="3" width="4" height="18" />
                <rect x="15" y="3" width="4" height="18" />
            </svg>
        </button>

        <div class="lofi-info">
            <span class="lofi-label">LO-FI RADIO</span>
            <div class="lofi-bars">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>
    <a href="https://buymeacoffee.com/miguel_filipe" target="_blank" rel="noopener noreferrer" class="coffee-btn" aria-label="Buy me a coffee">
    <svg class="coffee-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8H17V16C17 18.2091 15.2091 20 13 20H7C4.79086 20 3 18.2091 3 16V8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M17 9.5H18.5C19.8807 9.5 21 10.6193 21 12C21 13.3807 19.8807 14.5 18.5 14.5H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M7 5.5C7 4.5 8 4 7.5 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        <path d="M10.5 5.5C10.5 4.5 11.5 4 11 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        <path d="M14 5.5C14 4.5 15 4 14.5 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
    </svg>
    <span class="coffee-label">BUY ME A COFFEE</span>
</a>
    <div class="text_div">
        <p><b class="text">JUST CHILL</b></p>
    </div>
    <div class="header">
        <a href="index.html" class="title_header">Lofi Cat Radio</a>
        <nav class="header_links">
            <a href="sobre_lofi.html">Sobre</a>
            <a href="contato_lofi.html">Contato</a>
        </nav>
    </div>
    <img class="gif_cat" src="https://i.pinimg.com/originals/aa/82/91/aa82914c441301352cdb8cf1c8193414.gif">
    <script>
        const turbulence = document.getElementById('turbulence');
        let freq = 0;

        function animarOnda() {
            freq += 0.01;
            const fx = 0.01 + Math.sin(freq) * 0.006;
            turbulence.setAttribute('baseFrequency', `${fx.toFixed(4)} 0.05`);
            requestAnimationFrame(animarOnda);
        }

        animarOnda();

        const audio = document.getElementById('lofi-audio');
        const toggle = document.getElementById('lofi-toggle');
        const player = document.querySelector('.lofi-player');
        const iconPlay = toggle.querySelector('.icon-play');
        const iconPause = toggle.querySelector('.icon-pause');

        toggle.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(err => console.error('Erro ao tocar áudio:', err));
                player.classList.add('playing');
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
            } else {
                audio.pause();
                player.classList.remove('playing');
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            }
        });
    </script>
</body>

</html>
